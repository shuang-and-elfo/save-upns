<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EE" />
      <stop offset="100%" stop-color="#F2EAD6" />
    </linearGradient>
  </defs>
  <!-- Rounded Organic Background Badge -->
  <rect x="4" y="4" width="92" height="92" rx="28" fill="url(#bg)" stroke="#35483C" stroke-width="4" />

  <!-- Sun in upper right -->
  <circle cx="74" cy="28" r="11" fill="#F2C65A" />
  <path d="M74,10 L74,14 M74,42 L74,46 M56,28 L60,28 M88,28 L92,28" stroke="#F2C65A" stroke-width="3" stroke-linecap="round" />

  <!-- Green Bush / Tree on Left -->
  <circle cx="28" cy="68" r="14" fill="#7A9A60" />
  <circle cx="20" cy="74" r="10" fill="#5F7D48" />

  <!-- Schoolhouse Body -->
  <rect x="34" y="52" width="44" height="28" rx="3" fill="#FFFFFF" stroke="#35483C" stroke-width="3.5" />
  
  <!-- Terracotta Roof -->
  <path d="M30,52 L56,32 L82,52 Z" fill="#D86F58" stroke="#35483C" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Cute Window -->
  <rect x="48" y="59" width="14" height="14" rx="2" fill="#E6F2F8" stroke="#35483C" stroke-width="2.5" />
  <line x1="55" y1="59" x2="55" y2="73" stroke="#35483C" stroke-width="2" />
  <line x1="48" y1="66" x2="62" y2="66" stroke="#35483C" stroke-width="2" />

  <!-- Little Heart on Gable -->
  <path d="M56,41 C56,41 53,38 51,40 C49,42 51,45 56,48 C61,45 63,42 61,40 C59,38 56,41 56,41 Z" fill="#F2C65A" />
</svg>
